version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Container
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: event_booking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: event_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ----------------------------------------------------
  # 2. Redis Caching & BullMQ Container
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: event_booking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ----------------------------------------------------
  # 3. Node.js API Backend Container
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_booking_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/event_booking_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars
      JWT_EXPIRES_IN: 1d
      REFRESH_TOKEN_SECRET: super-secret-refresh-key-change-in-production
      REFRESH_TOKEN_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
